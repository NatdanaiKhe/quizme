name: Debug Deploy (Homelab)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  debug-deploy:
    name: Test Tailscale & SSH Connection
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Secrets and Variables
        run: |
          echo "=== Checking Secrets & Variables presence ==="
          if [ -n "${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}" ]; then
            echo "TAILSCALE_OAUTH_CLIENT_ID: [OK - SET]"
          else
            echo "::error::TAILSCALE_OAUTH_CLIENT_ID is EMPTY or NOT FOUND in environment 'PROD' or Repository Secrets!"
          fi

          if [ -n "${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}" ]; then
            echo "TAILSCALE_OAUTH_CLIENT_SECRET: [OK - SET]"
          else
            echo "::error::TAILSCALE_OAUTH_CLIENT_SECRET is EMPTY or NOT FOUND in environment 'PROD' or Repository Secrets!"
          fi

          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY: [OK - SET]"
          else
            echo "::warning::SSH_PRIVATE_KEY is EMPTY or NOT FOUND!"
          fi

          echo "HOMELAB_HOST variable: '${{ vars.HOMELAB_HOST }}'"
          echo "HOMELAB_USER variable: '${{ vars.HOMELAB_USER }}'"
          echo "HOMELAB_COMPOSE_DIR variable: '${{ vars.HOMELAB_COMPOSE_DIR }}'"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ vars.HOMELAB_HOST }}

      - name: Test SSH to Homelab
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOMELAB_HOST: ${{ vars.HOMELAB_HOST }}
          HOMELAB_USER: ${{ vars.HOMELAB_USER }}
        run: |
          set -euo pipefail
          SSH_TARGET="${HOMELAB_USER:+${HOMELAB_USER}@}${HOMELAB_HOST}"
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_ARGS+=(-i ~/.ssh/deploy_key)
          fi

          echo "Attempting SSH connection to $SSH_TARGET..."
          ssh "${SSH_ARGS[@]}" "$SSH_TARGET" "echo 'SSH connection successful! Host: \$(hostname), User: \$(whoami)'"
