name: Build & Deploy (Homelab)

# Homelab deployment pipeline (Traefik + GHCR + Tailscale).
#
#   push (tags v*) / PR -> lint + test + build
#   push tags           -> build + push images to GHCR (sha + git-tag)
#                       -> deploy to homelab over Tailscale SSH

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -v ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend lint
        run: cd frontend && npm run lint

      - name: Frontend build
        run: cd frontend && npm run build

  build-push:
    name: Build & push to GHCR
    needs: lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag

      - name: Docker metadata (migrator)
        id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator
          tags: |
            type=sha
            type=ref,event=tag

      - name: Build and push migrator
        id: build-migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push app
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image digests
        run: |
          echo "App image:       ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "App digest:      ${{ steps.build-app.outputs.digest }}"
          echo "Migrator image:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator"
          echo "Migrator digest: ${{ steps.build-migrator.outputs.digest }}"

  deploy:
    name: Deploy to homelab
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: PROD [HOMELAB]
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      IMAGE_TAG: ${{ github.ref_name }}
      COMPOSE_DIR: ${{ vars.HOMELAB_COMPOSE_DIR || '/opt/quizme' }}
      HOMELAB_HOST: ${{ vars.HOMELAB_HOST }}
      HOMELAB_USER: ${{ vars.HOMELAB_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ vars.HOMELAB_HOST }}

      - name: Deploy over Tailscale SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${IMAGE_NAME,,}"
          APP_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          MIGRATOR_IMAGE="${REGISTRY}/${IMAGE_NAME}-migrator:${IMAGE_TAG}"
          SSH_TARGET="${HOMELAB_USER:+${HOMELAB_USER}@}${HOMELAB_HOST}"
          SSH_ARGS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_ARGS+=(-i ~/.ssh/deploy_key)
          fi

          ssh "${SSH_ARGS[@]}" "$SSH_TARGET" bash -s <<REMOTE
          set -euo pipefail
          cd "$COMPOSE_DIR"

          if grep -q '^GHCR_IMAGE=' .env; then
            grep '^GHCR_IMAGE=' .env | cut -d= -f2- | sed 's|.*:||' > .prev-tag
          fi

          if grep -q '^GHCR_IMAGE=' .env; then
            sed -i "s|^GHCR_IMAGE=.*|GHCR_IMAGE=$APP_IMAGE|" .env
          else
            printf 'GHCR_IMAGE=%s\n' "$APP_IMAGE" >> .env
          fi

          if grep -q '^GHCR_MIGRATOR_IMAGE=' .env; then
            sed -i "s|^GHCR_MIGRATOR_IMAGE=.*|GHCR_MIGRATOR_IMAGE=$MIGRATOR_IMAGE|" .env
          else
            printf 'GHCR_MIGRATOR_IMAGE=%s\n' "$MIGRATOR_IMAGE" >> .env
          fi

          docker compose -f docker-compose.prod.yml pull app migrate
          docker compose -f docker-compose.prod.yml run --rm migrate
          docker compose -f docker-compose.prod.yml up -d --no-deps --wait --wait-timeout 120 app
          docker compose -f docker-compose.prod.yml exec -T app wget -qO- http://localhost:8080/health | grep -q '"status":"ok"'
          docker compose -f docker-compose.prod.yml ps
          echo "deployed $APP_IMAGE"
          REMOTE
