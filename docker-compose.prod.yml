services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizme}
      POSTGRES_DB: ${POSTGRES_DB:-quizme}
    volumes:
      - quizme_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizme} -d ${POSTGRES_DB:-quizme}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-quizme}:${POSTGRES_PASSWORD:-quizme}@db:5432/${POSTGRES_DB:-quizme}?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-quizme}:${POSTGRES_PASSWORD:-quizme}@db:5432/${POSTGRES_DB:-quizme}?sslmode=disable
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      migrate:
        condition: service_completed_successfully

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  quizme_pg_data:
