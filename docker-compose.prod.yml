services:
  migrate:
    image: ${GHCR_MIGRATOR_IMAGE}
    restart: "no"
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    networks:
      - proxy

  app:
    image: ${GHCR_IMAGE}
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.quizme.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.quizme.entrypoints=websecure"
      - "traefik.http.routers.quizme.tls=true"
      - "traefik.http.routers.quizme.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.quizme.loadbalancer.server.port=8080"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    profiles:
      - tunnel
    networks:
      - proxy

networks:
  proxy:
    external: true
